name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Build frontend assets
        run: npm run build
        env:
          NODE_ENV: production
          HUSKY: '0'

      - name: Sync application code on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "→ Pulling latest code..."
            git pull origin main
            echo "→ Installing PHP dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Upload frontend build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: public/build/
          target: ${{ secrets.DEPLOY_PATH }}/public/
          overwrite: true
          rm: true

      - name: Finalize deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "→ Backing up database before migrate..."
            BACKUP_DIR="${{ secrets.DEPLOY_PATH }}/storage/backups"
            mkdir -p "$BACKUP_DIR"
            DB_DATABASE=$(grep -E '^DB_DATABASE=' .env | head -1 | cut -d '=' -f2- | tr -d '"' | tr -d "'")
            DB_USERNAME=$(grep -E '^DB_USERNAME=' .env | head -1 | cut -d '=' -f2- | tr -d '"' | tr -d "'")
            DB_PASSWORD=$(grep -E '^DB_PASSWORD=' .env | head -1 | cut -d '=' -f2- | tr -d '"' | tr -d "'")
            DB_HOST=$(grep -E '^DB_HOST=' .env | head -1 | cut -d '=' -f2- | tr -d '"' | tr -d "'")
            BACKUP_FILE="$BACKUP_DIR/pre-migrate-$(date +%Y%m%d-%H%M%S).sql"
            mysqldump -h "${DB_HOST:-127.0.0.1}" -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" > "$BACKUP_FILE"
            echo "   backup saved: $BACKUP_FILE"
            # Giữ 14 bản backup gần nhất
            ls -1t "$BACKUP_DIR"/pre-migrate-*.sql 2>/dev/null | tail -n +15 | xargs -r rm -f

            echo "→ Running migrations..."
            php artisan migrate --force

            echo "→ Caching configuration..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "→ Restarting queue workers..."
            php artisan queue:restart

            echo "→ Health check..."
            curl -f http://localhost/api/health || exit 1

            echo "✅ Deployment complete!"

      - name: Notify on success
        if: success()
        run: echo "Deployment successful! Commit ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment FAILED! Check logs."
