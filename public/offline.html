<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020B0B" />
    <title>VA Dispatch — Ngoại tuyến</title>
    <style>
      :root {
        --brand: #9a0036;
        --bg: #f8f4f5;
        --text: #1a0a0d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 1.5rem;
      }
      .card {
        max-width: 22rem;
        text-align: center;
        background: #fff;
        border-radius: 1rem;
        padding: 2rem 1.5rem;
        box-shadow: 0 8px 32px rgba(154, 0, 54, 0.12);
      }
      img {
        width: 4.5rem;
        height: auto;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.125rem;
        margin: 0 0 0.5rem;
        color: var(--brand);
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.9375rem;
        line-height: 1.5;
        opacity: 0.88;
      }
      a,
      button {
        display: inline-block;
        background: var(--brand);
        color: #fff;
        text-decoration: none;
        border: none;
        border-radius: 0.5rem;
        padding: 0.65rem 1.25rem;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }
      button {
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/images/logo/logo_pwa_v1.png" width="96" height="96" alt="" decoding="async" />
      <h1>Không có kết nối</h1>
      <p>Ứng dụng cần mạng để đồng bộ. Kiểm tra Wi‑Fi hoặc dữ liệu di động rồi thử lại.</p>
      <a href="/">Về trang chủ</a>
      <div style="margin-top: 0.75rem">
        <button type="button" onclick="location.reload()">Tải lại</button>
      </div>
    </div>
  </body>
</html>
